services:
  postgres:
    image: postgres:16-alpine
    container_name: idl_postgres
    environment:
      POSTGRES_USER: idl_admin
      POSTGRES_PASSWORD: secure_local_password
      POSTGRES_DB: idl_site_operations
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: idl_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: idl_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  redisdata:
  qdrant_data:
